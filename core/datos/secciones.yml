# Cesta: de la categoria de cada cadena a una seccion comun.
#
# POR QUE ESTE FICHERO Y NO UN MODELO
#   Son 849 claves. Un fichero se lee de un vistazo, se corrige en diez segundos
#   y no se equivoca en silencio. Un clasificador de texto acierta el 90 % y el
#   10 % restante no se sabe cual es hasta que alguien lo ve en pantalla.
#
# COMO SE USA
#   clave = la categoria de la cadena, recortada:
#     alcampo    los dos primeros niveles de su arbol  ('Bebidas > Cervezas')
#     dia        los dos primeros trozos de su URL     ('zumos-y-smoothies/smoothies')
#     el resto   su categoria tal cual
#   valor = una de las secciones de SECCIONES (abajo), o `null` si no encaja.
#
# ESTADO: repasado. Las 849 claves estan asignadas.
#   El 97 % salio de una propuesta automatica por palabras clave; las 25 que
#   quedaron fuera se miraron y se decidieron a mano el 17 de septiembre.
#   Cobertura medida sobre el catalogo: 99,5 % de los productos.
#
#   Si una cadena cambia su arbol apareceran claves nuevas sin asignar, y la
#   prueba `test_no_crecen_las_claves_sin_repasar` avisara.
#
# Al lado de cada clave va cuantos productos tiene, para saber cuales merecen
# mas cuidado.

