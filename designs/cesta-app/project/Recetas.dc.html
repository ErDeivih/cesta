      <button type="button" aria-label="Buscar una receta" style="width: 44px; height: 44px; flex: none; display: inline-flex; align-items: center; justify-content: center; background: none; border: 0; border-radius: var(--radio-pastilla); color: var(--tinta); cursor: pointer;">

      </div>

    <a href="#" style="display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 16px; background: var(--papel); border-radius: var(--radio-tarjeta); box-shadow: var(--sombra-apoyado); text-decoration: none;">

        <span class="etiqueta" style="display: block; color: var(--tinta-tenue);">4 raciones · 25 min</span>
      </span>
      <span class="etiqueta" style="flex: none; color: var(--tinta-tenue);">sin coste</span>

    <a href="#" style="display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 16px; background: var(--papel); border-radius: var(--radio-tarjeta); box-shadow: var(--sombra-apoyado); text-decoration: none;">

      </span>
      <span class="etiqueta" style="flex: none; color: var(--tinta-tenue);">sin coste</span>

    <a href="#" style="display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; border: 1px dashed var(--borde-fuerte); border-radius: var(--radio-campo); color: var(--tinta-suave); text-decoration: none; font-size: 16px; line-height: 24px;">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 5v14M5 12h14"></path></svg>
      Crear una receta
