# Cesta: la plataforma entera en un comando.
#
#   docker compose up -d      arrancar
#   docker compose logs -f    ver que pasa
#   docker compose down       parar
#
# Los datos se quedan en tu PC. Lo unico que sale de aqui es lo que pidan los
# moviles a traves de Tailscale, y Tailscale no publica nada en internet.

name: cesta

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cesta
      POSTGRES_PASSWORD: ${CESTA_CLAVE_DB:?falta CESTA_CLAVE_DB en el fichero .env}
      POSTGRES_DB: cesta
      # Sin esto, un contenedor recreado no lee el volumen anterior.
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - datos_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cesta -d cesta"]
      interval: 10s
      timeout: 5s
      retries: 10
    # **El puerto se publica EN EL PC, y solo en el PC** (`127.0.0.1`), desde el 23 de
    # septiembre de 2026. Antes no se publicaba: *"solo lo alcanza la API, por la red
    # interna"*, y eso dejaba a la cadena diaria sin poder preguntar nada. Lo que hacia
    # falta: el paso de los avisos (`projects/cesta/avisos.py`) corre en el PC a las
    # 06:00 y tiene que mirar las alertas, que viven aqui; sin el puerto decia "no lo se"
    # y el resumen de la manana no podia contar cuantas saltaron.
    #
    # `127.0.0.1` y no `5432:5432` a proposito: asi la base **no se asoma ni a la wifi ni
    # a Tailscale**. Solo la alcanza un proceso de esta maquina, que es exactamente lo que
    # es la cadena diaria. La API sigue entrando por la red interna (`db:5432`).
    ports:
      - "127.0.0.1:5432:5432"

  api:
    build:
      context: ..
      dockerfile: plataforma/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      CESTA_POSTGRES: postgresql://cesta:${CESTA_CLAVE_DB}@db:5432/cesta
      CESTA_GOLD: /datos/gold
      CESTA_ORIGENES: ${CESTA_ORIGENES:-http://localhost:8080}
      CESTA_DIAS_SESION: ${CESTA_DIAS_SESION:-30}
    volumes:
      # SOLO LECTURA, y es importante: gold lo escribe el pipeline una vez al
      # dia y la API no lo toca nunca. Si un dia el scraper falla, aqui se sigue
      # sirviendo lo de ayer y la interfaz lo dice.
      - ${CESTA_DATOS:-../data}:/datos:ro

  web:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      # Solo en la interfaz de Tailscale si esta definida; si no, en todas.
      # Lo segundo esta bien mientras el router no tenga nada abierto, pero lo
      # primero es lo correcto.
          # **Por defecto, SOLO loopback.** *Antes el valor por defecto era `0.0.0.0`, asi que la web
    # escuchaba en **todas** las interfaces de la maquina sin que nadie lo hubiera pedido.*
    #
    # *Lo medido el 12 de octubre de 2026, con `docker ps`:* **de los cinco contenedores, era el UNICO
    # en `0.0.0.0`** -- `cesta-db-1`, `cesta-prueba-db` y `facylf-postgres` estaban en `127.0.0.1`, y
    # `cesta-api-1` no publicaba puerto. *Asi que el patrón del proyecto ya era loopback, y la web era la
    # excepcion.*
    #
    # **Y no es lo mismo estar en loopback que no estarlo**, aunque no haya nada abierto a Internet:
    # *`0.0.0.0` significa **cualquier interfaz**, y eso incluye la red de casa, la del trabajo y
    # cualquier VPN.* *Que hoy no haya nada mirando no lo convierte en una decision.*
    #
    # *Para abrirlo a proposito se pone `CESTA_ESCUCHA=0.0.0.0`, que ahora hay que querer.* **El encargo
    # lo dice con estas palabras: «no realices despliegues publicos».**
    - "${CESTA_ESCUCHA:-127.0.0.1}:8080:8080"
    volumes:
      # La interfaz nueva. Vite compila a `web/dist` (ver `web/app/vite.config.ts`)
      # y Caddy sirve eso; antes se servia la carpeta entera, con el `index.html`
      # y el `app.js` escritos a mano.
      #
      # **PUESTA EN PRODUCCION EL 24 DE SEPTIEMBRE DE 2026.** El montaje estaba
      # escrito desde antes, pero el contenedor seguia sirviendo `./web`: el cambio
      # de linea no basta, hay que recrear el servicio (`docker compose up -d web`),
      # y eso es lo que se hizo ese dia. Lo que se midio antes y despues:
      #
      #   antes   `:8080/` servia el `index.html` viejo (6.858 bytes, del 22 sep)
      #   despues `:8080/` sirve el paquete de Vite (`/assets/index-*.js`)
      #
      # La paridad **ya no falta**: cuando se escribio el aviso de arriba faltaban
      # avisos de precio, escritura sin cobertura, las tres pantallas del panel,
      # el filtro por cadenas cercanas y «Darme de baja». Todo eso esta hecho (el
      # detalle y las fechas, en `docs/BACKLOG.md` §0 y `docs/CIERRE-ENCARGO-UX.md`),
      # y la auditoria que lo comprueba compara el `app.js` entero contra `app/src`.
      #
      # **Antes de dar por bueno un despliegue, o despues de tocar esto:**
      #
      #   uv run python -m plataforma.prueba_produccion
      #
      # que mira **lo que se sirve** (el paquete compilado, las cabeceras de Caddy
      # con el CSP, la base de casa) y no el servidor de desarrollo. Existe porque
      # el dia que se cambio esta linea la API del contenedor devolvio 500 en
      # `/api/ofertas-dudosas` -- un import perezoso de `core.derive`, que arrastra
      # polars y no esta en su imagen -- y la puerta del navegador no podia verlo:
      # corria contra el uvicorn del PC, donde polars si esta.
      #
      # Volver atras es cambiar esta linea por `./web:/srv:ro` y recrear la web. La
      # interfaz vieja **no se borra**: es el plan B, y lo vigila
      # `tests/test_interfaz.py`.
      - ./web/dist:/srv:ro
      # **El material de aprendizaje**, en `/aprende/`. Es un sitio estatico generado con
      # `uv run --extra docs python -m plataforma.aprende` a partir de los documentos
      # (`docs/aprende/*.md` son el curso y `docs/*.md` la referencia).
      #
      # Va montado **fuera de `/srv`**, en `/aprende`, y el `Caddyfile` lo sirve con
      # `handle_path`. La primera version lo monto en `/srv/aprende` y el contenedor **no
      # arranco**: Docker tiene que crear ese punto de montaje *dentro* de `/srv`, que ya
      # esta montado de solo lectura, y falla con `read-only file system`. Un montaje
      # anidado dentro de otro de solo lectura no se puede.
      #
      # Se monta en vez de copiarse a proposito: regenerar el material es relanzar el
      # comando, sin reconstruir ninguna imagen.
      - ./web/aprende:/aprende:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - datos_caddy:/data

volumes:
  datos_db:
  datos_caddy:
