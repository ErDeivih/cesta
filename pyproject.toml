[project]
name = "scrap"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "curl-cffi>=0.7",
  "httpx>=0.27",
  "selectolax>=0.3",
  "pydantic>=2.7",
  "polars>=1.0",
  "pyarrow>=16",
  "duckdb>=1.0",
  "python-dotenv>=1.0",
  "tenacity>=8.3",
  "tzdata>=2024.1",
  "patchright>=1.47",   # navegador parcheado: solo para resolver retos tipo WAF   # Windows no trae zonas horarias: sin esto, polars revienta
]

[project.optional-dependencies]
# La plataforma (API + web). El scraper no las necesita, asi que van aparte:
# `uv sync --extra plataforma` solo hace falta para levantarla fuera de Docker.
plataforma = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "psycopg[binary,pool]>=3.2",
  "argon2-cffi>=23",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5", "ipykernel", "httpx>=0.27"]
extras = ["playwright", "rapidfuzz", "sentence-transformers", "streamlit", "dbt-duckdb"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = ["-p", "no:cacheprovider"]

[tool.ruff]
line-length = 96
exclude = [".venv", "data", "notebooks"]

[tool.ruff.lint]
# BLE va incluido porque el codigo ya usa `# noqa: BLE001` a proposito:
# sin el, esos avisos se convierten en "noqa sobrante" y hacen ruido.
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "BLE"]
ignore = [
  "E501",    # el largo lo controla line-length y ya avisa el formateador
  "RUF001",  # castellano: las comillas tipograficas no son homoglifos sospechosos
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# `Depends()` en el valor por defecto es LA forma de declarar dependencias en
# FastAPI, no una llamada mutable compartida entre peticiones.
"plataforma/api/*.py" = ["B008"]
# En una prueba, dos `with` anidados se leen mejor que una linea de 120
# caracteres, y ahi la legibilidad manda sobre la concision.
"tests/*.py" = ["SIM117"]
